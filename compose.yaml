services:
  manta:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      API_KEY: ${API_KEY:?Configura API_KEY}
      ADMIN_KEY: ${ADMIN_KEY:?Configura ADMIN_KEY}
      HOST: 0.0.0.0
      PORT: 8080
      STATE_FILE: /app/runtime/world.json
    volumes:
      - world:/app/runtime
    read_only: true
    tmpfs:
      - /tmp
    init: true
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 3
volumes:
  world:
